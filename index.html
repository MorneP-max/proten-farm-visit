<style>
:root{
  --bg:#f3f4f7; --card:#ffffff; --ink:#1f2430; --muted:#6b7280; --line:#dfe3ea;
  --brand:#1c2a4f; --brand2:#2f456f; --accent:#d6b07f; --ok:#2e7d4f; --warn:#c77a12; --bad:#b3322b;
  --chip:#eef1f7; --radius:14px;
}
@media (prefers-color-scheme: dark){
  :root{ --bg:#10141d; --card:#191f2c; --ink:#e8ebf2; --muted:#9aa3b5; --line:#2a3242; --chip:#232b3c; --brand:#5b7bbf; --brand2:#d6b07f;}
}
*{box-sizing:border-box;-webkit-tap-highlight-color:transparent}
html,body{margin:0;background:var(--bg);color:var(--ink);font:16px/1.45 -apple-system,BlinkMacSystemFont,"SF Pro Text","Segoe UI",Roboto,sans-serif}
header.top{position:sticky;top:0;z-index:20;background:#1c2a4f;border-bottom:3px solid #d6b07f;color:#fff;padding:calc(env(safe-area-inset-top) + 10px) 16px 12px;display:flex;align-items:center;gap:10px}
header.top h1{font-size:18px;margin:0;font-weight:650;flex:1;white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
header.top .sync{font-size:11px;opacity:.8;max-width:90px;text-align:right;line-height:1.2}
main{padding:14px 14px calc(env(safe-area-inset-bottom) + 90px);max-width:760px;margin:0 auto}
nav.tabs{position:fixed;bottom:0;left:0;right:0;z-index:30;background:var(--card);border-top:1px solid var(--line);display:flex;padding-bottom:env(safe-area-inset-bottom)}
nav.tabs button{flex:1;background:none;border:0;padding:9px 4px 8px;color:var(--muted);font-size:11px;display:flex;flex-direction:column;align-items:center;gap:2px}
nav.tabs button svg{width:24px;height:24px}
nav.tabs button.on{color:var(--brand)}
.card{background:var(--card);border:1px solid var(--line);border-radius:var(--radius);padding:14px;margin-bottom:12px}
.card h2{font-size:16px;margin:0 0 10px;display:flex;align-items:center;gap:8px}
.card h3{font-size:14px;margin:14px 0 6px;color:var(--brand2);border-left:3px solid var(--accent);padding-left:7px;text-transform:uppercase;letter-spacing:.04em}
.muted{color:var(--muted)} .small{font-size:13px}
label.f{display:block;margin-bottom:10px}
label.f span{display:block;font-size:13px;color:var(--muted);margin-bottom:3px}
input,select,textarea{width:100%;min-width:0;max-width:100%;font:inherit;font-size:16px;color:var(--ink);background:var(--bg);border:1px solid var(--line);border-radius:10px;padding:10px 11px;appearance:none;-webkit-appearance:none}
textarea{min-height:80px;resize:vertical}
input:focus,select:focus,textarea:focus{outline:2px solid var(--brand2);outline-offset:-1px}
.grid2{display:grid;grid-template-columns:minmax(0,1fr) minmax(0,1fr);gap:0 10px}
.grid3{display:grid;align-items:end;grid-template-columns:repeat(3,minmax(0,1fr));gap:0 10px}
@media (max-width:380px){.grid3{grid-template-columns:1fr 1fr}}
.btn{display:inline-flex;align-items:center;justify-content:center;gap:6px;border:0;border-radius:11px;padding:12px 16px;font:inherit;font-weight:600;background:var(--brand);color:#fff;cursor:pointer}
.btn.sec{background:var(--chip);color:var(--brand)}
.btn.ghost{background:none;color:var(--brand);padding:8px 10px}
.btn.danger{background:none;color:var(--bad)}
.btn.block{width:100%}
.btn:disabled{opacity:.5}
.row{display:flex;gap:8px;align-items:center;flex-wrap:wrap}
.spacer{flex:1}
.visit-item{display:flex;gap:12px;align-items:center;padding:12px;border:1px solid var(--line);border-radius:12px;margin-bottom:8px;background:var(--card)}
.visit-item .t{font-weight:600}
.badge{font-size:11px;font-weight:700;padding:3px 8px;border-radius:20px;background:var(--chip);color:var(--brand)}
.badge.sent{background:#e3f1e8;color:var(--ok)}
.badge.warn{background:#fbefdc;color:var(--warn)}
.badge.bad{background:#f8e1df;color:var(--bad)}
.steps{display:flex;gap:6px;overflow-x:auto;padding-bottom:6px;margin:0 -14px 10px;padding-left:14px;padding-right:14px;scrollbar-width:none}
.steps::-webkit-scrollbar{display:none}
.steps button{flex:none;border:1px solid var(--line);background:var(--card);color:var(--ink);border-radius:20px;padding:7px 13px;font:inherit;font-size:14px}
.steps button.on{background:var(--brand);color:#fff;border-color:var(--brand)}
.shed{border:1px solid var(--line);border-radius:12px;padding:12px;margin-bottom:12px;background:var(--bg)}
.shed-head{display:flex;align-items:center;gap:8px;margin-bottom:8px}
.shed-head b{font-size:16px}
.kpis{display:grid;grid-template-columns:repeat(3,1fr);gap:6px;margin:6px 0 10px}
.kpi{background:var(--card);border:1px solid var(--line);border-radius:10px;padding:7px 8px}
.kpi .l{font-size:11px;color:var(--muted)} .kpi .v{font-weight:700;font-size:15px}
.kpi.ok .v{color:var(--ok)} .kpi.warn .v{color:var(--warn)} .kpi.bad .v{color:var(--bad)}
.chk{padding:10px 0;border-bottom:1px solid var(--line)}
.chk:last-child{border-bottom:0}
.chk .q{font-size:15px;margin-bottom:6px}
.seg{display:inline-flex;border:1px solid var(--line);border-radius:9px;overflow:hidden}
.seg button{border:0;background:var(--card);color:var(--ink);padding:7px 13px;font:inherit;font-size:14px;font-weight:600}
.seg button+button{border-left:1px solid var(--line)}
.seg button.y.on{background:var(--ok);color:#fff}
.seg button.n.on{background:var(--bad);color:#fff}
.seg button.na.on{background:var(--muted);color:#fff}
.chk input.note{margin-top:6px;font-size:14px;padding:8px 10px}
.act{border:1px solid var(--line);border-radius:12px;padding:10px;margin-bottom:10px;background:var(--bg)}
.photos{display:grid;grid-template-columns:repeat(3,1fr);gap:8px}
.photo{position:relative;border-radius:10px;overflow:hidden;background:var(--chip);aspect-ratio:1}
.photo img{width:100%;height:100%;object-fit:cover;display:block}
.photo button{position:absolute;top:4px;right:4px;background:rgba(0,0,0,.6);color:#fff;border:0;border-radius:50%;width:26px;height:26px;font-size:15px;line-height:26px;padding:0}
.photo input{position:absolute;bottom:0;left:0;right:0;border:0;border-radius:0;font-size:12px;padding:5px;background:rgba(255,255,255,.88);color:#000}
canvas.sig{width:100%;height:160px;border:1px dashed var(--muted);border-radius:12px;background:#fff;touch-action:none}
.toast{position:fixed;left:50%;transform:translateX(-50%);bottom:calc(env(safe-area-inset-bottom) + 76px);background:#222;color:#fff;padding:10px 16px;border-radius:22px;font-size:14px;z-index:50;opacity:0;transition:opacity .25s;pointer-events:none;max-width:90%;text-align:center}
.toast.show{opacity:1}
.ref-sec summary{font-weight:650;font-size:16px;padding:4px 0;cursor:pointer;list-style:none;display:flex;align-items:center}
.ref-sec summary::after{content:"+";margin-left:auto;font-size:20px;color:var(--muted)}
.ref-sec[open] summary::after{content:"–"}
.ref-sec .body{padding-top:8px}
table.t{width:100%;border-collapse:collapse;font-size:13px}
table.t th,table.t td{padding:6px 5px;border-bottom:1px solid var(--line);text-align:left;vertical-align:top}
table.t th{color:var(--muted);font-weight:600;font-size:12px}
.tablewrap{overflow-x:auto}
ul.tight{margin:4px 0 8px;padding-left:20px} ul.tight li{margin:3px 0}
.callout{background:#fbefdc;color:#5c3a05;border-radius:12px;padding:12px;margin-bottom:12px;font-size:14px}
.callout.red{background:#f8e1df;color:#5d1612}
@media (prefers-color-scheme: dark){.callout{background:#3a2e17;color:#f3d9a8}.callout.red{background:#3d1d1b;color:#f2c1bd}.badge.sent{background:#1e3a29}.badge.warn{background:#3a2e17}.badge.bad{background:#3d1d1b}}
.preview{font-size:14px}
.preview h4{margin:12px 0 4px;color:var(--brand2)}
.flag{display:block;font-size:13px;margin:2px 0}
.flag.bad{color:var(--bad)} .flag.warn{color:var(--warn)}
.empty{text-align:center;padding:40px 10px;color:var(--muted)}
.empty svg{width:64px;height:64px;opacity:.5}
.searchbox{margin-bottom:12px}
.hide{display:none!important}
.modal-bg{position:fixed;inset:0;background:rgba(0,0,0,.45);z-index:60;display:flex;align-items:flex-end;justify-content:center}
.modal{background:var(--card);border-radius:18px 18px 0 0;padding:18px 16px calc(env(safe-area-inset-bottom) + 18px);width:100%;max-width:760px}
.modal h3{margin:0 0 8px}
</style>
</head>
<body>
<header class="top">
<img id="logo" alt="ProTen" style="height:24px;flex:none">
  <h1 id="title" style="border-left:1px solid rgba(255,255,255,.3);padding-left:10px">Broiler Farm Visit</h1>
  <span class="sync" id="sync">Saved on this device</span>
</header>

<main id="main"></main>

<nav class="tabs">
  <button data-tab="visits" class="on"><svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.8"><rect x="4" y="3" width="16" height="18" rx="2"/><path d="M8 8h8M8 12h8M8 16h5"/></svg>Visits</button>
  <button data-tab="visit"><svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.8"><path d="M12 20h9"/><path d="M16.5 3.5a2.1 2.1 0 0 1 3 3L7 19l-4 1 1-4Z"/></svg>Current visit</button>
  <button data-tab="report"><svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.8"><path d="M4 4h16v16H4z"/><path d="m4 4 8 8 8-8"/></svg>Report</button>
  <button data-tab="ref"><svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.8"><path d="M4 19.5A2.5 2.5 0 0 1 6.5 17H20V3H6.5A2.5 2.5 0 0 0 4 5.5z"/><path d="M4 19.5V21h16"/></svg>Reference</button>
</nav>
<div class="toast" id="toast"></div>

<script>
/* ============================================================
   REFERENCE DATA (Australian broiler production)
   ============================================================ */
// Approximate as-hatched performance (blend of current Ross 308 / Cobb 500 objectives). Always confirm with the breed's current objectives and integrator targets.
const TARGETS = [
  {d:0,  w:42,   fcr:null, t:[31,33], rh:"40–60", feed:"Starter", water:null},
  {d:7,  w:200,  fcr:0.88, t:[28,30], rh:"40–60", feed:"Starter", water:60},
  {d:14, w:520,  fcr:1.10, t:[25,27], rh:"50–60", feed:"Grower", water:120},
  {d:21, w:1000, fcr:1.28, t:[22,24], rh:"50–65", feed:"Grower", water:190},
  {d:28, w:1650, fcr:1.42, t:[20,22], rh:"50–70", feed:"Finisher", water:260},
  {d:35, w:2350, fcr:1.55, t:[19,21], rh:"50–70", feed:"Finisher", water:310},
  {d:42, w:3050, fcr:1.68, t:[18,20], rh:"50–70", feed:"Withdrawal", water:340},
  {d:49, w:3650, fcr:1.80, t:[18,20], rh:"50–70", feed:"Withdrawal", water:350},
];
function interp(age, key){
  if(age==null||isNaN(age)) return null;
  if(age<=0) return TARGETS[0][key];
  for(let i=0;i<TARGETS.length-1;i++){
    const a=TARGETS[i], b=TARGETS[i+1];
    if(age>=a.d && age<=b.d){
      const va=a[key], vb=b[key]; if(va==null||vb==null) return vb??va;
      return va + (vb-va)*(age-a.d)/(b.d-a.d);
    }
  }
  return TARGETS[TARGETS.length-1][key];
}
function tempTarget(age){
  if(age==null||isNaN(age)) return null;
  const lo=interp(age,'tlo'), hi=interp(age,'thi'); return [lo,hi];
}
TARGETS.forEach(t=>{t.tlo=t.t[0]; t.thi=t.t[1];});

const CHECKS = [
  {id:"bio", title:"Biosecurity", items:[
    ["bio1","Farm entry signage in place; gates closed / locked"],
    ["bio4","Shed-specific boots or boot covers & footbaths in use and fresh"],
    ["bio14","Boot scrapers available at shed entries"],
    ["bio5","Clean overalls / PPE and hand sanitiser at each shed"],
    ["bio6","Wheel wash working and chemicals available"],
    ["bio7","Wild birds excluded from sheds, feed and water (nets, no gaps)"],
    ["bio8","No standing water / wild bird attractants near sheds"],
    ["bio9","Rodent control: bait stations maintained, records current"],
    ["bio10","Drinking water treated (esp. surface / dam water) and tested"],
    ["bio11","Feed bins sealed; spilt feed cleaned up"],
    ["bio15","Silo pads clean"],
    ["bio12","Dead birds collected daily; disposal adequate (freezer / compost)"],
  ]},
  {id:"wel", title:"Welfare (Poultry Standards)", items:[
    ["wel1","Birds active, alert and evenly spread across the shed"],
    ["wel2","All birds have easy access to feed and water (correct line heights)"],
    ["wel3","Room to stand, turn, flap wings and all sit at once"],
    ["wel6","Sick / lame birds identified and culled promptly and humanely"],
  ]},
  {id:"env", title:"Shed environment & equipment", items:[
    ["env1","Ventilation (min vent / tunnel) set correctly for bird age"],
    ["env2","Weekly alarm test working"],
    ["env3","All generators tested"],
    ["env11","Diesel stock adequate for generators"],
    ["env4","Evaporative cooling pads / foggers working, clean"],
    ["env12","Cool cell rooms clean"],
    ["env5","Heaters / brooders working (for young birds)"],
    ["env9","Drinker line pressure / height correct; no leaks"],
    ["env10","Water meters & feed system working; feed in pans"],
  ]},
  {id:"fac", title:"Facilities upkeep", items:[
    ["fac1","Toilets clean"],
    ["fac2","Office clean and tidy"],
    ["fac3","Smoko room clean and tidy"],
  ]},
  {id:"chem", title:"Chemical storage & farm vehicles", items:[
    ["chem1","Chemicals stored in a locked, bunded, ventilated area away from feed"],
    ["chem2","Chemicals in original, labelled containers"],
    ["chem3","Safety data sheets (SDS) available and chemical register up to date"],
    ["chem4","Spill kit and PPE available"],
    ["chem5","Empty containers stored / disposed of correctly"],
    ["chem6","Fuel stored safely and away from sheds"],
    ["veh1","Farm vehicles in good condition (tractors, loaders, utes, quad bikes)"],
    ["veh2","Vehicles clean – no litter or manure build-up"],
    ["veh3","Vehicles serviced; lights, brakes and safety equipment working"],
  ]},
];

const PURPOSES=["Routine flock visit","Placement / brooding check","Pre-pick-up check","Problem / disease investigation","Biosecurity audit","Welfare audit","Clean-out / shed preparation","Other"];
const BREEDS=["Ross 308","Cobb 500","Other"];
const LITTER=["1 – Dry, friable","2 – Slightly damp","3 – Damp, some caking","4 – Wet, caked","5 – Very wet / capped"];

/* ============================================================
   STORAGE: claude db (per-person, private) with local fallback
   ============================================================ */
const S = { db:null, uid:null, dl:null, visits:{}, currentId:null, tab:"visits", step:0, standalone:false, outbox:[], dirty:new Set() };
// Running on claude.ai (artifact) or on its own web address (GitHub Pages)?
function inClaude(){ let framed=false; try{ framed=window.top!==window.self; }catch(e){ framed=true; } return !!window.claude || /claude/i.test(location.hostname) || framed; }
const TICKOFF_URL="https://xucdcvkxxlugozwpyllu.supabase.co/functions/v1/app-inbox";

/* ---- IndexedDB: the phone's own storage (used outside claude.ai) ---- */
const IDB={ db:null,
  open(){ return new Promise(res=>{ try{ const r=indexedDB.open("proten-farm-visit",1);
    r.onupgradeneeded=()=>r.result.createObjectStore("kv"); r.onsuccess=()=>{ IDB.db=r.result; res(true); };
    r.onerror=()=>res(false); r.onblocked=()=>res(false); }catch(e){ res(false); } }); },
  get(k){ return new Promise(res=>{ try{ const q=IDB.db.transaction("kv","readonly").objectStore("kv").get(k); q.onsuccess=()=>res(q.result); q.onerror=()=>res(undefined); }catch(e){ res(undefined); } }); },
  set(k,v){ return new Promise(res=>{ try{ const t=IDB.db.transaction("kv","readwrite"); t.objectStore("kv").put(v,k); t.oncomplete=()=>res(true); t.onerror=()=>res(false); t.onabort=()=>res(false); }catch(e){ res(false); } }); },
  del(k){ return new Promise(res=>{ try{ const t=IDB.db.transaction("kv","readwrite"); t.objectStore("kv").delete(k); t.oncomplete=()=>res(true); t.onerror=()=>res(false); }catch(e){ res(false); } }); },
  all(){ return new Promise(res=>{ try{ const st=IDB.db.transaction("kv","readonly").objectStore("kv"); const ks=st.getAllKeys(), vs=st.getAll();
    vs.onsuccess=()=>res(ks.result.map((k,i)=>[k,vs.result[i]])); vs.onerror=()=>res([]); }catch(e){ res([]); } }); }
};
let flushTimer=null;
function scheduleFlush(){ clearTimeout(flushTimer); flushTimer=setTimeout(flushNow,350); }
async function flushNow(){
  clearTimeout(flushTimer);
  if(!IDB.db) return;
  const ids=[...S.dirty]; S.dirty.clear();
  for(const id of ids){ const v=S.visits[id]; if(v){ const ok=await IDB.set("v:"+id,v); if(!ok){ S.dirty.add(id); toast("Phone storage is full – export a backup and delete old visits"); } } }
}
function dropLocal(id){ S.dirty.delete(id); if(IDB.db) IDB.del("v:"+id); }
function saveOutbox(){ if(IDB.db) IDB.set("outbox",S.outbox); else lsSet("proten.outbox",S.outbox); }
const LS_KEY="broilerVisits.v1", LS_CUR="broilerVisits.current";
function lsGet(k){try{return JSON.parse(localStorage.getItem(k))}catch(e){return null}}
function lsSet(k,v){try{localStorage.setItem(k,JSON.stringify(v));return true}catch(e){return false}}

function setSync(t){document.getElementById('sync').textContent=t}

async function initCaps(){
  if(!window.claude||!claude.use) return;
  try{
    const [db,user,dl]=await Promise.all([claude.use("db"),claude.use("user"),claude.use("downloads")]);
    S.dl=dl||null;
    if(db&&user){
      const id=await user.id();
      if(id){ S.db=db; S.uid=id; }
    }
  }catch(e){}
  if(S.db){ setSync("Syncing…"); await loadFromDb(); }
  if(S.tab==="visits") render();
}
function col(){ return S.db.collection("data/users/"+S.uid); }

async function loadFromDb(){
  const timer=setTimeout(()=>setSync("Offline – saved on device"),10000);
  try{
    const snap=await col().where("kind","==","visit").get();
    clearTimeout(timer);
    snap.docs.forEach(d=>{
      const v=d.data(); if(!v) return;
      const local=S.visits[v.id];
      if(local && (local.updated||0)>(v.updated||0)){ local._synced=false; return; }
      if(!local || (v.updated||0)>=(local.updated||0)){
        S.visits[v.id]=Object.assign(JSON.parse(JSON.stringify(v)),{photos:local?local.photos:[]});
      }
    });
    // photos
    const ps=await col().where("kind","==","photo").get();
    const byVisit={};
    ps.docs.forEach(d=>{const p=d.data(); if(p){(byVisit[p.visitId]=byVisit[p.visitId]||[]).push({id:p.id,data:p.data,caption:p.caption||"",n:p.n||0});}});
    Object.keys(byVisit).forEach(vid=>{ if(S.visits[vid]){ const loc=S.visits[vid].photos||[]; if(!loc.length || loc.every(x=>x.synced)) S.visits[vid].photos=byVisit[vid].sort((a,b)=>a.n-b.n).map(p=>({...p,synced:true})); }});
    // push local-only visits up
    for(const v of Object.values(S.visits)){ if(!v._synced) queueSave(v.id); }
    persistLocal();
    setSync("Synced to your account");
  }catch(e){ clearTimeout(timer); setSync("Saved on this device"); }
}

function persistLocal(){
  lsSet(LS_CUR,S.currentId);
  if(S.standalone && IDB.db){ scheduleFlush(); return; }
  const ok=lsSet(LS_KEY,S.visits);
  if(!ok){ // too big (photos) – store without photo data
    const slim={}; for(const [k,v] of Object.entries(S.visits)){ slim[k]={...v,photos:(v.photos||[]).filter(p=>p.synced).map(p=>({...p,data:null}))}; }
    lsSet(LS_KEY,slim);
  }
  lsSet(LS_CUR,S.currentId);
}

const saveTimers={}; const saving={};
function queueSave(id){
  const v=S.visits[id]; if(!v) return;
  v.updated=Date.now(); S.dirty.add(id);
  persistLocal();
  if(!S.db) return;
  clearTimeout(saveTimers[id]);
  saveTimers[id]=setTimeout(()=>pushVisit(id),900);
}
async function pushVisit(id){
  if(saving[id]){ saveTimers[id]=setTimeout(()=>pushVisit(id),800); return; }
  const v=S.visits[id]; if(!v||!S.db) return;
  saving[id]=true; setSync("Syncing…");
  try{
    const body=JSON.parse(JSON.stringify(v)); delete body.photos; body.kind="visit"; body._synced=true;
    body.photoIds=(v.photos||[]).map(p=>p.id);
    await col().doc("v_"+id).set(body);
    v._synced=true;
    // photos
    for(let i=0;i<(v.photos||[]).length;i++){
      const p=v.photos[i];
      if(!p.synced && p.data){
        await col().doc("p_"+p.id).set({kind:"photo",id:p.id,visitId:id,n:i,data:p.data,caption:p.caption||""});
        p.synced=true; p.capSynced=p.caption;
      } else if(p.synced && p.capSynced!==p.caption){
        await col().doc("p_"+p.id).update({caption:p.caption||""}); p.capSynced=p.caption;
      }
    }
    persistLocal();
    setSync("Synced to your account");
  }catch(e){
    setSync(e&&e.code==="quota_exceeded"?"Storage full – delete old visits":"Saved on device (sync failed)");
  }finally{ saving[id]=false; }
}
async function removeVisitRemote(v){
  if(!S.db) return;
  try{ await col().doc("v_"+v.id).delete(); for(const p of v.photos||[]) await col().doc("p_"+p.id).delete(); }catch(e){}
}

/* ============================================================
   MODEL
   ============================================================ */
function uid(){return Date.now().toString(36)+Math.random().toString(36).slice(2,7)}
function today(){const d=new Date(); return d.getFullYear()+"-"+String(d.getMonth()+1).padStart(2,"0")+"-"+String(d.getDate()).padStart(2,"0")}
function nowTime(){const d=new Date(); return String(d.getHours()).padStart(2,"0")+":"+String(d.getMinutes()).padStart(2,"0")}
function newShed(n, base){ return Object.assign({no:String(n), placeDate:"", breed:"Ross 308", sex:"Mixed", placed:"", area:"", vent:"Tunnel", mort:"", culls:"", weight:"", uniformity:"", water:"", feed:"", tmin:"", tmax:"", rh:"", nh3:"", co2:"", litter:"", footpad:"", lux:"", dark:"", notes:""}, base||{}); }
function newVisit(from){
  const id=uid();
  const v={ id, kind:"visit", status:"draft", created:Date.now(), updated:Date.now(),
    farm: from? {...from.farm} : {name:"",grower:"",address:"",pic:"",integrator:"",email:"",cc:"",phone:"",state:"QLD"},
    visit:{date:today(),timeIn:nowTime(),timeOut:"",visitor:lsGet("broilerVisits.me")?.visitor||"",company:lsGet("broilerVisits.me")?.company||"",purpose:PURPOSES[0],lastFarm:"",lastDate:"",batch:""},
    sheds: from? from.sheds.map(s=>newShed(s.no,{placeDate:s.placeDate,breed:s.breed,sex:s.sex,placed:s.placed,area:s.area,vent:s.vent})) : [newShed(1)],
    water:{cl:"",clo2:"",ph:""}, checks:{}, actions:[], summary:"", nextVisit:"", photos:[], signature:{name:"",data:""}
  };
  S.visits[id]=v; S.currentId=id; queueSave(id); return v;
}
function cur(){ return S.visits[S.currentId]||null; }

function num(x){ const n=parseFloat(x); return isNaN(n)?null:n; }
function ageOf(shed, date){
  if(!shed.placeDate||!date) return null;
  const a=new Date(date+"T00:00:00"), b=new Date(shed.placeDate+"T00:00:00");
  return Math.round((a-b)/86400000);
}
function shedCalc(shed, date){
  const age=ageOf(shed,date);
  const placed=num(shed.placed), mort=num(shed.mort)||0, culls=num(shed.culls)||0, area=num(shed.area), w=num(shed.weight);
  const r={age};
  if(placed){ r.live=placed-mort-culls; r.mortPct=(mort+culls)/placed*100; }
  if(r.live!=null && area){ r.birdsM2=r.live/area; if(w) r.density=r.live*w/1000/area; }
  if(age!=null && age>=0){ r.tw=interp(age,'w'); r.tt=tempTarget(age); r.twater=interp(age,'water'); }
  if(w && r.tw) r.wPct=w/r.tw*100;
  // flags
  const f=[];
  if(shed.ctrl==="N") f.push(["bad",`Controller settings not correct${(shed.ctrlNote||"").trim()?" – "+shed.ctrlNote.trim():""}`]);
  const lit=shed.litter? parseInt(shed.litter):null; if(lit>=4) f.push(["warn","Wet / caked litter – check drinkers, ventilation and gut health"]);
  r.flags=f;
  return r;
}
function fmt(n,d=0){ return n==null||isNaN(n)?"–":Number(n).toLocaleString("en-AU",{minimumFractionDigits:d,maximumFractionDigits:d}); }
function esc(s){ return String(s??"").replace(/[&<>"']/g,c=>({"&":"&amp;","<":"&lt;",">":"&gt;",'"':"&quot;","'":"&#39;"}[c])); }
function dAU(s){ if(!s) return ""; const [y,m,d]=s.split("-"); return `${d}/${m}/${y}`; }

/* ============================================================
   UI helpers
   ============================================================ */
function toast(t,ms){ const el=document.getElementById('toast'); el.textContent=t; el.classList.add('show'); clearTimeout(toast._t); toast._t=setTimeout(()=>el.classList.remove('show'),ms||(t.length>60?5000:2600)); }
function field(label, path, opts={}){
  const v=getPath(cur(),path)??"";
  const type=opts.type||"text";
  const attrs=`data-path="${path}" ${opts.inputmode?`inputmode="${opts.inputmode}"`:""} ${opts.ph?`placeholder="${esc(opts.ph)}"`:""}`;
  let input;
  if(opts.options) input=`<select ${attrs}>${opts.options.map(o=>`<option ${o==v?"selected":""}>${esc(o)}</option>`).join("")}</select>`;
  else if(type==="textarea") input=`<textarea ${attrs}>${esc(v)}</textarea>`;
  else input=`<input type="${type}" value="${esc(v)}" ${attrs} ${type==="number"?'step="any"':''}>`;
  return `<label class="f"><span>${label}</span>${input}</label>`;
}
function getPath(o,p){ return p.split(".").reduce((a,k)=>a==null?a:a[k],o); }
function setPath(o,p,val){ const ks=p.split("."); let a=o; for(let i=0;i<ks.length-1;i++){ a=a[ks[i]]; } a[ks[ks.length-1]]=val; }

/* ============================================================

   ============================================================ */
const main=document.getElementById('main');
function render(){
  document.querySelectorAll('nav.tabs button').forEach(b=>b.classList.toggle('on',b.dataset.tab===S.tab));
  const v=cur();
  document.getElementById('title').textContent = S.tab==="ref"?"Reference": v&&S.tab!=="visits" ? (v.farm.name||"New visit") : "Farm Visit";
  if(S.tab==="visits") renderVisits();
  else if(S.tab==="visit") v? renderVisit(): renderNoVisit();
  else if(S.tab==="report") v? renderReport(): renderNoVisit();
  else renderRef();
  window.scrollTo(0,0);
}
function renderNoVisit(){
  main.innerHTML=`<div class="empty"><svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.5"><path d="M3 21V10l9-6 9 6v11"/><path d="M9 21v-6h6v6"/></svg><p>No visit open.</p><button class="btn" id="startNew">Start a new visit</button></div>`;
  document.getElementById('startNew').onclick=()=>{ newVisit(); S.tab="visit"; S.step=0; render(); };
}

function renderVisits(){
  const list=Object.values(S.visits).sort((a,b)=>(b.visit.date||"").localeCompare(a.visit.date||"")||b.created-a.created);
  const farms={}; list.forEach(v=>{ if(v.farm.name && !farms[v.farm.name]) farms[v.farm.name]=v; });
  main.innerHTML=`
  ${installTipHtml()}
  ${backupReminderHtml()}
  <div class="card">
    <h2>Start a visit</h2>
    <button class="btn block" id="nv">+ New farm visit</button>
    ${Object.keys(farms).length?`<p class="small muted" style="margin:12px 0 6px">Or repeat a farm (copies farm & shed details):</p>
    <select id="repeat"><option value="">Choose farm…</option>${Object.keys(farms).sort().map(f=>`<option>${esc(f)}</option>`).join("")}</select>`:""}
  </div>
  <div class="card">
    <h2>Visits <span class="spacer"></span><span class="small muted">${list.length}</span></h2>
    ${list.length? list.map(v=>{
      const flags=v.sheds.reduce((n,s)=>n+shedCalc(s,v.visit.date).flags.filter(f=>f[0]==="bad").length,0);
      return `<div class="visit-item" data-open="${v.id}">
        <div style="flex:1;min-width:0">
          <div class="t">${esc(v.farm.name||"Unnamed farm")}</div>
          <div class="small muted">${dAU(v.visit.date)} · ${esc(v.visit.purpose)} · ${v.sheds.length} shed${v.sheds.length>1?"s":""}</div>
        </div>
        ${flags?`<span class="badge bad">${flags} issue${flags>1?"s":""}</span>`:""}
        <span class="badge ${v.status==="sent"?"sent":""}">${v.status==="sent"?"Sent":"Draft"}</span>
      </div>`}).join("") : `<p class="muted small">No visits yet. Your visits are saved ${S.db?"to your Claude account and available on any device":"on this phone"}.</p>`}
  </div>
  ${S.standalone?outboxHtml():""}
  ${backupCardHtml()}`;
  bindVisitsExtras();
  document.getElementById('nv').onclick=()=>{ newVisit(); S.tab="visit"; S.step=0; render(); };
  const rp=document.getElementById('repeat'); if(rp) rp.onchange=()=>{ if(!rp.value) return; newVisit(farms[rp.value]); S.tab="visit"; S.step=0; render(); toast("Farm details copied"); };
  main.querySelectorAll('[data-open]').forEach(el=>el.onclick=()=>{ S.currentId=el.dataset.open; persistLocal(); S.tab="visit"; S.step=0; render(); });
}

const STEPS=["Farm","Visit","Sheds","Checklists","Actions","Photos"];

  const v=cur(); if(!v.water) v.water={cl:"",clo2:"",ph:""};
  let html=`<div class="steps">${STEPS.map((s,i)=>`<button data-step="${i}" class="${i===S.step?"on":""}">${i+1}. ${s}</button>`).join("")}</div>`;
  if(S.step===0){
    html+=`<div class="card"><h2>Farm details</h2>
      ${field("Farm name","farm.name",{ph:"e.g. Riverbend Farm"})}
      ${field("Grower / manager","farm.grower")}
      <div class="grid2">${field("State","farm.state",{options:["QLD","NSW","VIC","SA","WA","TAS","NT","ACT"]})}${field("Integrator / processor","farm.integrator")}</div>
    </div>
    ${S.standalone?`<div class="card" id="tkcard">${tickoffCardHtml(v)}</div>`:""}`;
  } else if(S.step===1){
    html+=`<div class="card"><h2>Visit details</h2>
      ${field("Date","visit.date",{type:"date"})}<div class="grid2">${field("Time in","visit.timeIn",{type:"time"})}${field("Time out","visit.timeOut",{type:"time"})}</div>
      <div class="grid2">${field("Visitor name","visit.visitor")}${field("Company / role","visit.company")}</div>
      ${field("Purpose of visit","visit.purpose",{options:PURPOSES})}
    </div>
    <div class="card"><h2>Farm water sanitation</h2>
      <p class="small muted" style="margin-top:-4px">One reading for the farm (end of drinker line).</p>
      <div class="grid3">
        ${field("Free chlorine (ppm)","water.cl",{type:"number",inputmode:"decimal"})}
        ${field("Chlorine dioxide (ppm)","water.clo2",{type:"number",inputmode:"decimal"})}
        ${field("pH","water.ph",{type:"number",inputmode:"decimal"})}
      </div>
      <div id="wflags">${waterFlags(v).map(f=>`<span class="flag warn">⚠️ ${esc(f[1])}</span>`).join("")}</div>
    </div>`;
  } else if(S.step===2){
    html+=`<div class="card"><h2>Sheds <span class="spacer"></span><button class="btn sec" id="addShed">+ Shed</button></h2>
    <p class="small muted" style="margin-top:-4px">Bird age is worked out from the placement date and the visit date.</p>
    ${v.sheds.map((s,i)=>shedHtml(s,i)).join("")}
    <button class="btn sec block" id="addShed2">+ Add shed</button></div>`;
  } else if(S.step===3){
    html+=CHECKS.map(sec=>{
      const done=sec.items.filter(([id])=>v.checks[id]&&v.checks[id].v).length;
      const nos=sec.items.filter(([id])=>v.checks[id]&&v.checks[id].v==="N").length;
      return `<div class="card"><h2>${sec.title}<span class="spacer"></span>${nos?`<span class="badge bad">${nos} No</span>`:""}<span class="small muted">${done}/${sec.items.length}</span></h2>
      ${sec.items.map(([id,q])=>{ const c=v.checks[id]||{}; return `<div class="chk"><div class="q">${esc(q)}</div>
        <div class="seg" data-chk="${id}"><button class="y ${c.v==="Y"?"on":""}" data-v="Y">Yes</button><button class="n ${c.v==="N"?"on":""}" data-v="N">No</button><button class="na ${c.v==="NA"?"on":""}" data-v="NA">N/A</button></div>
        <input class="note ${c.v==="N"||c.note?"":"hide"}" data-note="${id}" placeholder="Comment" value="${esc(c.note||"")}"></div>`}).join("")}
      </div>`}).join("");
  } else if(S.step===4){
    const suggestions=autoActions(v);
    html+=`<div class="card"><h2>Actions & recommendations <span class="spacer"></span><button class="btn sec" id="addAct">+ Action</button></h2>
      ${v.actions.length?"":`<p class="small muted">No actions yet.</p>`}
      ${v.actions.map((a,i)=>`<div class="act">
        <textarea data-act="${i}" data-k="text" placeholder="What needs to be done">${esc(a.text)}</textarea>
        <div class="grid3" style="margin-top:8px">
          <label class="f"><span>Priority</span><select data-act="${i}" data-k="priority">${["High","Medium","Low"].map(p=>`<option ${a.priority===p?"selected":""}>${p}</option>`).join("")}</select></label>
          <label class="f"><span>Who</span><input data-act="${i}" data-k="who" value="${esc(a.who||"")}" placeholder="Grower"></label>
          <label class="f"><span>By</span><input type="date" data-act="${i}" data-k="due" value="${esc(a.due||"")}"></label>
        </div>
        <button class="btn danger small" data-delact="${i}">Remove</button></div>`).join("")}
      ${suggestions.length?`<h3>Suggested from your readings</h3>${suggestions.map((s,i)=>`<div class="row" style="margin-bottom:6px"><span class="small" style="flex:1">${esc(s.text)}</span><button class="btn sec small" data-sugg="${i}">Add</button></div>`).join("")}`:""}
    </div>
    <div class="card"><h2>Summary for the farm</h2>
      ${field("Overall comments","summary",{type:"textarea",ph:"Overall flock condition, what's going well, key concerns…"})}
      ${field("Next visit","nextVisit",{type:"date"})}
    </div>`;
    main.innerHTML=html; bindVisit();
    main.querySelectorAll('[data-sugg]').forEach(b=>b.onclick=()=>{ v.actions.push({...suggestions[b.dataset.sugg],who:"Grower",due:""}); queueSave(v.id); renderVisit(); });
    return;
  } else if(S.step===5){
    html+=`<div class="card"><h2>Photos <span class="spacer"></span><span class="small muted">${v.photos.length}</span></h2>
      <label class="btn block" style="margin-bottom:12px">📷 Take / add photos<input type="file" id="ph" accept="image/*" multiple style="display:none"></label>
      <div class="photos">${v.photos.map((p,i)=>`<div class="photo">${p.data?`<img src="${p.data}">`:`<div class="small muted" style="padding:10px">Photo stored in account</div>`}<button data-delph="${i}">×</button><input data-cap="${i}" value="${esc(p.caption)}" placeholder="Caption"></div>`).join("")}</div>
      ${v.photos.length?"":`<p class="small muted">Photos are resized and included in the PDF report.</p>`}
    </div>
    <div class="card">
      <h2>Finish visit</h2>
      ${(()=>{ const m=[]; if(!v.farm.name) m.push("farm name"); if(!v.visit.visitor) m.push("your name"); return m.length?`<div class="callout">Still missing: ${m.join(", ")}. You can finish anyway.</div>`:""; })()}
      <button class="btn block" id="finish" style="padding:16px;font-size:17px">✅ Finish &amp; create PDF</button>
      ${S.standalone?tickoffFinishNote(v):""}
      <p class="small muted" style="margin:8px 0 0">Builds the ProTen PDF report. On iPhone the share sheet opens – choose <b>Mail</b> and send it to the farm.</p>
      <button class="btn ghost block" id="toReport" style="margin-top:6px">Preview report first</button>
    </div>
    <div class="card"><button class="btn danger block" id="delVisit">Delete this visit</button></div>`;
  }
  html+=`<div class="row"><button class="btn sec" id="prev" ${S.step===0?"disabled":""}>← Back</button><span class="spacer"></span>${S.step<STEPS.length-1?`<button class="btn" id="next">Next →</button>`:""}</div>`;
  main.innerHTML=html;
  bindVisit();
}

function shedHtml(s,i){
  const v=cur(); const r=shedCalc(s,v.visit.date); const p=`sheds.${i}.`;
  return `<div class="shed" data-shed="${i}">
    <div class="shed-head"><b>Shed</b><input style="width:70px" data-path="${p}no" value="${esc(s.no)}"><span class="spacer"></span>
      <span class="badge agebadge">${r.age!=null?`Day ${r.age}`:"Age ?"}</span>
      ${v.sheds.length>1?`<button class="btn danger small" data-delshed="${i}">Remove</button>`:""}</div>
    <div class="calc">
    ${r.flags.map(f=>`<span class="flag ${f[0]}">${f[0]==="bad"?"⛔":"⚠️"} ${esc(f[1])}</span>`).join("")}</div>
    ${field("Placement date (for bird age)",p+"placeDate",{type:"date"})}
    <h3>Controller settings</h3>
    <div class="chk" style="border:0;padding-top:0"><div class="q">Controller settings checked and correct</div>
      <div class="seg" data-ctrl="${i}"><button class="y ${s.ctrl==="Y"?"on":""}" data-v="Y">Yes</button><button class="n ${s.ctrl==="N"?"on":""}" data-v="N">No</button></div>
    </div>
    ${field("Controller comments",p+"ctrlNote",{type:"textarea",ph:"e.g. set temp, min vent timers, curve, alarms"})}
    ${field("Litter",p+"litter",{options:["",...LITTER]})}
    ${field("Observations",p+"notes",{type:"textarea",ph:"Bird behaviour, distribution, crop fill, droppings, respiratory signs…"})}
  </div>`;
}

function waterFlags(v){
  const w=v.water||{}, f=[];
  const cl=num(w.cl); if(cl!=null && cl<1) f.push(["warn",`Free chlorine ${cl} ppm – below 1 ppm, water sanitation may be ineffective`]); else if(cl!=null && cl>5) f.push(["warn",`Free chlorine ${cl} ppm – high, check dosing`]);
  const ph=num(w.ph); if(ph!=null && (ph<6||ph>8)) f.push(["warn",`Water pH ${ph} – outside 6.0–8.0`]); else if(ph!=null && cl!=null && ph>7.5) f.push(["warn",`Water pH ${ph} – chlorine works less well above pH 7.5`]);
  return f;
}
function autoActions(v){
  const out=[]; const have=new Set(v.actions.map(a=>a.text));
  waterFlags(v).forEach(f=>{ const t=`Water: ${f[1]}`; if(!have.has(t)) out.push({text:t,priority:"Medium"}); });
  v.sheds.forEach(s=>{ shedCalc(s,v.visit.date).flags.forEach(f=>{ const t=`Shed ${s.no}: ${f[1]}`; if(!have.has(t)) out.push({text:t,priority:f[0]==="bad"?"High":"Medium"}); }); });
  CHECKS.forEach(sec=>sec.items.forEach(([id,q])=>{ const c=v.checks[id]; if(c&&c.v==="N"){ const t=`${sec.title}: ${q}${c.note?" – "+c.note:""}`; if(!have.has(t)) out.push({text:t,priority:sec.id==="bio"||sec.id==="wel"?"High":"Medium"}); } }));
  return out;
}

function bindVisit(){
  const v=cur();
  main.querySelectorAll('[data-step]').forEach(b=>b.onclick=()=>{ S.step=+b.dataset.step; render(); });
  const pv=document.getElementById('prev'), nx=document.getElementById('next');
  if(pv) pv.onclick=()=>{ S.step=Math.max(0,S.step-1); render(); };
  if(nx) nx.onclick=()=>{ S.step=Math.min(STEPS.length-1,S.step+1); render(); };
  main.querySelectorAll('[data-path]').forEach(el=>{
    const ev = el.tagName==="SELECT"||el.type==="date"||el.type==="time" ? "change":"input";
    el.addEventListener(ev,()=>{
      setPath(v,el.dataset.path,el.value);
      if(el.dataset.path==="visit.visitor"||el.dataset.path==="visit.company") lsSet("broilerVisits.me",{visitor:v.visit.visitor,company:v.visit.company});
      queueSave(v.id);
      if(el.dataset.path.startsWith("sheds.")) refreshShed(+el.dataset.path.split(".")[1]);
      if(el.dataset.path.startsWith("water.")){ const wf=document.getElementById('wflags'); if(wf) wf.innerHTML=waterFlags(v).map(f=>`<span class="flag warn">⚠️ ${esc(f[1])}</span>`).join(""); }
      if(el.dataset.path==="farm.name"){ document.getElementById('title').textContent=v.farm.name||"New visit"; const tk=document.getElementById('tkcard'); if(tk){ tk.innerHTML=tickoffCardHtml(v); bindTickoffCard(v); } }
    });
  });
  const add=()=>{ const last=v.sheds[v.sheds.length-1]; v.sheds.push(newShed((parseInt(last?.no)||v.sheds.length)+1,last?{placeDate:last.placeDate,breed:last.breed,sex:last.sex,vent:last.vent,area:last.area}:{})); queueSave(v.id); renderVisit(); main.querySelector(`[data-shed="${v.sheds.length-1}"]`)?.scrollIntoView({behavior:"smooth"}); };
  ["addShed","addShed2"].forEach(id=>{ const b=document.getElementById(id); if(b) b.onclick=add; });
  main.querySelectorAll('[data-ctrl]').forEach(seg=>seg.querySelectorAll('button').forEach(b=>b.onclick=()=>{
    const i=+seg.dataset.ctrl, sh=v.sheds[i]; sh.ctrl = sh.ctrl===b.dataset.v ? "" : b.dataset.v;
    seg.querySelectorAll('button').forEach(x=>x.classList.toggle('on',x.dataset.v===sh.ctrl));
    queueSave(v.id); refreshShed(i);
    if(sh.ctrl==="N"){ const n=main.querySelector(`[data-path="sheds.${i}.ctrlNote"]`); if(n) n.focus(); }
  }));
  main.querySelectorAll('[data-delshed]').forEach(b=>b.onclick=()=>confirmBox(`Remove shed ${v.sheds[b.dataset.delshed].no}?`,()=>{ v.sheds.splice(+b.dataset.delshed,1); queueSave(v.id); renderVisit(); }));
  // checklists
  main.querySelectorAll('[data-chk]').forEach(seg=>seg.querySelectorAll('button').forEach(b=>b.onclick=()=>{
    const id=seg.dataset.chk; const c=v.checks[id]||(v.checks[id]={});
    c.v = c.v===b.dataset.v? "" : b.dataset.v;
    seg.querySelectorAll('button').forEach(x=>x.classList.toggle('on',x.dataset.v===c.v));
    const note=main.querySelector(`[data-note="${id}"]`); if(c.v==="N"){ note.classList.remove('hide'); note.focus(); }
    queueSave(v.id);
  }));
  main.querySelectorAll('[data-note]').forEach(el=>el.oninput=()=>{ (v.checks[el.dataset.note]||(v.checks[el.dataset.note]={})).note=el.value; queueSave(v.id); });
  // actions
  const aa=document.getElementById('addAct'); if(aa) aa.onclick=()=>{ v.actions.push({text:"",priority:"Medium",who:"Grower",due:""}); queueSave(v.id); renderVisit(); };
  main.querySelectorAll('[data-act]').forEach(el=>el.addEventListener(el.tagName==="SELECT"||el.type==="date"?"change":"input",()=>{ v.actions[+el.dataset.act][el.dataset.k]=el.value; queueSave(v.id); }));
  main.querySelectorAll('[data-delact]').forEach(b=>b.onclick=()=>{ v.actions.splice(+b.dataset.delact,1); queueSave(v.id); renderVisit(); });
  // photos
  const ph=document.getElementById('ph'); if(ph) ph.onchange=async()=>{
    for(const f of ph.files){ try{ const data=await shrink(f); v.photos.push({id:uid(),data,caption:"",synced:false}); }catch(e){ toast("Couldn't read a photo"); } }
    queueSave(v.id); renderVisit();
  };
  main.querySelectorAll('[data-delph]').forEach(b=>b.onclick=()=>{ const p=v.photos.splice(+b.dataset.delph,1)[0]; if(S.db&&p.synced) col().doc("p_"+p.id).delete().catch(()=>{}); queueSave(v.id); renderVisit(); });
  main.querySelectorAll('[data-cap]').forEach(el=>el.oninput=()=>{ v.photos[+el.dataset.cap].caption=el.value; queueSave(v.id); });
  // signature
  const tr=document.getElementById('toReport'); if(tr) tr.onclick=()=>{ S.tab="report"; render(); };
  if(document.getElementById('tkcard')) bindTickoffCard(v);
  const fin=document.getElementById('finish'); if(fin) fin.onclick=async()=>{ if(!v.visit.timeOut){ v.visit.timeOut=nowTime(); } v.completed=Date.now(); queueSave(v.id); flushNow();
    const queued = S.standalone ? queueTickOff(v) : false;
    await makePdf(v,fin); S.tab="report"; render();
    if(queued) processOutbox(true); };
  const dv=document.getElementById('delVisit'); if(dv) dv.onclick=()=>confirmBox("Delete this visit and its photos? This can't be undone.",async()=>{ const vv=cur(); delete S.visits[vv.id]; dropLocal(vv.id); S.currentId=null; persistLocal(); await removeVisitRemote(vv); S.tab="visits"; render(); toast("Visit deleted"); });
}
function refreshShed(i){
  const el=main.querySelector(`[data-shed="${i}"]`); if(!el) return;
  const tmp=document.createElement('div'); tmp.innerHTML=shedHtml(cur().sheds[i],i);
  const fresh=tmp.firstElementChild;
  el.querySelector('.calc').replaceWith(fresh.querySelector('.calc'));
  el.querySelector('.agebadge').textContent=fresh.querySelector('.agebadge').textContent;
}
function confirmBox(msg,yes){
  const bg=document.createElement('div'); bg.className="modal-bg";
  bg.innerHTML=`<div class="modal"><h3>${esc(msg)}</h3><div class="row" style="margin-top:14px"><button class="btn sec" style="flex:1" id="cNo">Cancel</button><button class="btn" style="flex:1;background:var(--bad)" id="cYes">Yes</button></div></div>`;
  document.body.appendChild(bg);
  bg.querySelector('#cNo').onclick=()=>bg.remove(); bg.onclick=e=>{ if(e.target===bg) bg.remove(); };
  bg.querySelector('#cYes').onclick=()=>{ bg.remove(); yes(); };
}
function shrink(file){
  return new Promise((res,rej)=>{
    const img=new Image(); const url=URL.createObjectURL(file);
    img.onload=()=>{ let max=1100, q=0.7, out;
      for(let k=0;k<6;k++){ const sc=Math.min(1,max/Math.max(img.width,img.height)); const c=document.createElement('canvas'); c.width=Math.round(img.width*sc); c.height=Math.round(img.height*sc); c.getContext('2d').drawImage(img,0,0,c.width,c.height); out=c.toDataURL('image/jpeg',q); if(out.length<190000) break; max*=0.8; q-=0.07; }
      URL.revokeObjectURL(url); res(out); };
    img.onerror=rej; img.src=url;
  });
}
function initSig(c,v){
  const r=c.getBoundingClientRect(), dpr=window.devicePixelRatio||1; c.width=r.width*dpr; c.height=r.height*dpr;
  const ctx=c.getContext('2d'); ctx.scale(dpr,dpr); ctx.lineWidth=2.2; ctx.lineCap="round"; ctx.strokeStyle="#111";
  if(v.signature.data){ const im=new Image(); im.onload=()=>ctx.drawImage(im,0,0,r.width,r.height); im.src=v.signature.data; }
  let draw=false, last=null;
  const pos=e=>{ const b=c.getBoundingClientRect(); return [e.clientX-b.left,e.clientY-b.top]; };
  c.onpointerdown=e=>{ draw=true; last=pos(e); c.setPointerCapture(e.pointerId); };
  c.onpointermove=e=>{ if(!draw) return; const p=pos(e); ctx.beginPath(); ctx.moveTo(...last); ctx.lineTo(...p); ctx.stroke(); last=p; };
  c.onpointerup=c.onpointercancel=()=>{ if(!draw) return; draw=false; const o=document.createElement('canvas'); o.width=500; o.height=160; o.getContext('2d').drawImage(c,0,0,500,160); v.signature.data=o.toDataURL('image/png'); queueSave(v.id); };
  document.getElementById('sigClear').onclick=()=>{ ctx.clearRect(0,0,c.width,c.height); v.signature.data=""; queueSave(v.id); };
}

function reportText(v){
  const L=[];
  L.push(`FARM VISIT REPORT – ${v.farm.name||""}`);
  L.push(`Date: ${dAU(v.visit.date)}  ${v.visit.timeIn||""}${v.visit.timeOut?"–"+v.visit.timeOut:""}`);
  L.push(`Visitor: ${v.visit.visitor||""}${v.visit.company?" ("+v.visit.company+")":""}`);
  L.push(`Purpose: ${v.visit.purpose}`);
  L.push("");
  if(v.summary){ L.push("SUMMARY"); L.push(v.summary); L.push(""); }
  if(v.actions.length){ L.push("ACTIONS"); v.actions.forEach((a,i)=>L.push(`${i+1}. [${a.priority}] ${a.text}${a.who?" – "+a.who:""}${a.due?" by "+dAU(a.due):""}`)); L.push(""); }
  const w=v.water||{};
  L.push(`WATER SANITATION: free chlorine ${w.cl||"–"} ppm, chlorine dioxide ${w.clo2||"–"} ppm, pH ${w.ph||"–"}`); L.push("");
  L.push("SHEDS");
  v.sheds.forEach(s=>{ const r=shedCalc(s,v.visit.date);
    L.push(`Shed ${s.no}: day ${r.age??"?"}, controller settings ${s.ctrl==="Y"?"OK":s.ctrl==="N"?"NOT OK":"–"}${s.ctrlNote?" ("+s.ctrlNote+")":""}, litter ${s.litter?s.litter.split(" ")[0]:"–"}`);
    if(s.notes) L.push(`   ${s.notes}`);
  });
  const nos=[]; CHECKS.forEach(sec=>sec.items.forEach(([id,q])=>{ const c=v.checks[id]; if(c&&c.v==="N") nos.push(`- ${q}${c.note?" ("+c.note+")":""}`); }));
  if(nos.length){ L.push(""); L.push("CHECKLIST ITEMS NOT MET"); L.push(...nos); }
  if(v.nextVisit){ L.push(""); L.push(`Next visit: ${dAU(v.nextVisit)}`); }
  L.push(""); L.push(`Full report with photos attached as PDF.`);
  return L.join("\n");
}
function renderReport(){
  const v=cur();
  const sum=v.sheds.map(s=>({s,r:shedCalc(s,v.visit.date)}));
  const nos=[]; CHECKS.forEach(sec=>sec.items.forEach(([id,q])=>{ const c=v.checks[id]; if(c&&c.v==="N") nos.push([sec.title,q,c.note]); }));
  const answered=Object.values(v.checks).filter(c=>c.v).length, total=CHECKS.reduce((n,s)=>n+s.items.length,0);
  const missing=[]; if(!v.farm.name) missing.push("farm name"); if(!v.visit.visitor) missing.push("visitor name");
  main.innerHTML=`
  ${missing.length?`<div class="callout">Missing: ${missing.join(", ")}. <a href="#" id="fix">Fix</a></div>`:""}
  <div class="card"><h2>Send end-of-visit report</h2>
    ${v.completed?`<div class="callout" style="background:#e3f1e8;color:#1d4d31">✅ Visit finished. If the share sheet didn't open, tap the button below.</div>`:""}
    <p class="small muted" style="margin-top:-4px">Tap below to create the PDF. On iPhone the share sheet opens – choose <b>Mail</b> and send it to the farm.</p>
    <button class="btn block" id="pdf" style="margin-bottom:8px">📄 ${v.status==="sent"?"Create PDF again":"Create & share PDF"}</button>
    <div class="row"><a class="btn sec" style="flex:1;text-decoration:none" id="mail" href="#">✉️ Email</a><button class="btn sec" style="flex:1" id="copy">Copy text</button></div>
    ${S.standalone?tickoffReportHtml(v):""}
    <div class="row" style="margin-top:10px"><span class="small">Status: <span class="badge ${v.status==="sent"?"sent":""}">${v.status==="sent"?"Sent":"Draft"}</span></span><span class="spacer"></span><button class="btn ghost small" id="markSent">${v.status==="sent"?"Mark as draft":"Mark as sent"}</button></div>
  </div>
  <div class="card preview">
    <h2>${esc(v.farm.name||"Farm")} – ${dAU(v.visit.date)}</h2>
    <div class="small muted">${[esc(v.visit.purpose),esc(v.visit.visitor)].filter(Boolean).join(" · ")} · Checklist ${answered}/${total} answered</div>
    <h4>Summary</h4><div>${esc(v.summary||"—").replace(/\n/g,"<br>")}</div>
    <h4>Actions (${v.actions.length})</h4>
    ${v.actions.length?`<ol style="padding-left:20px;margin:4px 0">${v.actions.map(a=>`<li><span class="badge ${a.priority==="High"?"bad":a.priority==="Medium"?"warn":""}">${a.priority}</span> ${esc(a.text)} <span class="muted small">${esc(a.who||"")} ${a.due?"by "+dAU(a.due):""}</span></li>`).join("")}</ol>`:"<div class='muted'>None</div>"}
    <h4>Sheds</h4>
    <div class="tablewrap"><table class="t"><tr><th>Shed</th><th>Age</th><th>Controller</th><th>Litter</th><th>Observations</th></tr>
    ${sum.map(({s,r})=>`<tr><td>${esc(s.no)}</td><td>${r.age??"–"}</td><td>${s.ctrl==="Y"?`<span class="badge sent">Yes</span>`:s.ctrl==="N"?`<span class="badge bad">No</span>`:"–"}${s.ctrlNote?`<div class="small muted">${esc(s.ctrlNote)}</div>`:""}</td><td>${esc(s.litter?s.litter.split(" ")[0]:"–")}</td><td>${esc(s.notes||"")}</td></tr>`).join("")}</table></div>
    <h4>Farm water sanitation</h4>
    <div class="tablewrap"><table class="t"><tr><th>Free chlorine ppm</th><th>Chlorine dioxide ppm</th><th>pH</th></tr><tr><td>${esc(v.water?.cl||"–")}</td><td>${esc(v.water?.clo2||"–")}</td><td>${esc(v.water?.ph||"–")}</td></tr></table></div>
    ${(sum.some(x=>x.r.flags.length)||waterFlags(v).length)?`<h4>Flags</h4>${waterFlags(v).map(f=>`<span class="flag ${f[0]}">Water: ${esc(f[1])}</span>`).join("")}${sum.map(({s,r})=>r.flags.map(f=>`<span class="flag ${f[0]}">Shed ${esc(s.no)}: ${esc(f[1])}</span>`).join("")).join("")}`:""}
    ${nos.length?`<h4>Checklist items not met</h4><ul class="tight">${nos.map(n=>`<li>${esc(n[1])}${n[2]?` <span class="muted">– ${esc(n[2])}</span>`:""}</li>`).join("")}</ul>`:""}
    <h4>Photos</h4><div class="small muted">${v.photos.length} included</div>
  </div>`;
  const fx=document.getElementById('fix'); if(fx) fx.onclick=e=>{e.preventDefault(); S.tab="visit"; S.step=!v.visit.visitor&&v.farm.name?1:0; render();};
  const subj=`Farm visit report – ${v.farm.name||""} – ${dAU(v.visit.date)}`;
  const m=document.getElementById('mail');
  m.href=`mailto:?subject=${encodeURIComponent(subj)}&body=${encodeURIComponent(reportText(v))}`;
  m.target="_blank";
  document.getElementById('copy').onclick=async()=>{ try{ await navigator.clipboard.writeText(subj+"\n\n"+reportText(v)); toast("Report text copied"); }catch(e){ toast("Copy not allowed here – select text in preview"); } };
  document.getElementById('markSent').onclick=()=>{ v.status=v.status==="sent"?"draft":"sent"; if(v.status==="sent") v.sentAt=Date.now(); queueSave(v.id); renderReport(); };
  document.getElementById('pdf').onclick=()=>makePdf(v);
  const tks=document.getElementById('tkSend'); if(tks) tks.onclick=()=>{ if(queueTickOff(v,true)) processOutbox(true); renderReport(); };
}

/* ============================================================
   SHARING FILES (own web address): iPhone share sheet, else download
   ============================================================ */
function downloadBlob(blob,name){ const url=URL.createObjectURL(blob); const a=document.createElement('a'); a.href=url; a.download=name; document.body.appendChild(a); a.click(); a.remove(); setTimeout(()=>URL.revokeObjectURL(url),8000); }
async function shareFile(blob,name,type,readyText){
  const file=new File([blob],name,{type});
  const canShare=navigator.canShare && (()=>{ try{ return navigator.canShare({files:[file]}); }catch(e){ return false; } })();
  if(!canShare){ downloadBlob(blob,name); return true; }
  try{ await navigator.share({files:[file],title:name}); return true; }
  catch(e){
    if(e && e.name==="AbortError"){ toast("Not sent"); return false; }
    // iPhone sometimes needs a fresh tap after the file is built
    return await new Promise(resolve=>{
      const bg=document.createElement('div'); bg.className="modal-bg";
      bg.innerHTML=`<div class="modal"><h3>${esc(readyText)}</h3><p class="small muted">${esc(name)}</p><button class="btn block" id="shNow" style="padding:15px;font-size:17px">Share…</button><button class="btn ghost block" id="shNo" style="margin-top:6px">Cancel</button></div>`;
      document.body.appendChild(bg);
      bg.querySelector('#shNo').onclick=()=>{ bg.remove(); resolve(false); };
      bg.querySelector('#shNow').onclick=async()=>{ try{ await navigator.share({files:[file],title:name}); bg.remove(); resolve(true); }catch(err){ if(err&&err.name==="AbortError"){ bg.remove(); resolve(false); } else { bg.remove(); downloadBlob(blob,name); resolve(true); } } };
    });
  }
}

async function importBackup(file){

    S.visits[v.id]=v; S.dirty.add(v.id); if(S.db) queueSave(v.id);
    have?updated++:added++;
  }
  persistLocal(); await flushNow();
  toast(added||updated?`Brought in ${added} new visit${added===1?"":"s"}${updated?` and updated ${updated}`:""}`:"Nothing new in that backup");

/* ============================================================
   TICKOFF: send each report's actions to the farm's TickOff group
   (key is saved only on this phone – never in the code or on GitHub)
   ============================================================ */
const TK_KEYS="proten.tickoffKeys";
function farmKeyName(name){ return String(name||"").trim().toLowerCase(); }
function getKey(farm){ const m=lsGet(TK_KEYS)||{}; return m[farmKeyName(farm)]||""; }
function setKey(farm,key){ const m=lsGet(TK_KEYS)||{}; if(key) m[farmKeyName(farm)]=key; else delete m[farmKeyName(farm)]; lsSet(TK_KEYS,m); }
function keyLooksRight(k){ return /^tko_[A-Za-z0-9]{64}$/.test(k); }
function tickoffCardHtml(v){
  const name=(v.farm.name||"").trim(); const key=name?getKey(name):"";
  if(!name) return `<h2>TickOff</h2><p class="small muted" style="margin:0">Type the farm name above first. Then you can add this farm's TickOff key, so the visit's actions go to the farm's TickOff group.</p>`;
  return `<h2>TickOff <span class="spacer"></span>${key?`<span class="badge sent">Key saved</span>`:`<span class="badge">No key</span>`}</h2>
    <p class="small muted" style="margin-top:-4px">Paste <b>${esc(name)}</b>'s TickOff key. It's saved only on this phone, not in the report or the backup.</p>
    ${key?`<div class="row"><code class="small" style="flex:1;word-break:break-all">${esc(key.slice(0,8))}••••••••${esc(key.slice(-4))}</code><button class="btn danger small" id="tkRemove">Remove</button></div>`
         :`<label class="f" style="margin-bottom:6px"><span>TickOff key</span><input id="tkKey" type="text" autocomplete="off" autocapitalize="off" autocorrect="off" spellcheck="false" placeholder="tko_…"></label>
           <div id="tkMsg" class="small"></div>
           <button class="btn block" id="tkSave">Save key</button>`}`;
}
function bindTickoffCard(v){
  const save=document.getElementById('tkSave'), inp=document.getElementById('tkKey'), msg=document.getElementById('tkMsg'), rm=document.getElementById('tkRemove');
  const card=()=>{ const tk=document.getElementById('tkcard'); tk.innerHTML=tickoffCardHtml(v); bindTickoffCard(v); };
  if(inp) inp.oninput=()=>{ const k=inp.value.trim(); msg.innerHTML = !k?"": keyLooksRight(k)?`<span style="color:var(--ok)">✓ Looks right</span>`:`<span style="color:var(--warn)">A TickOff key starts with tko_ followed by 64 letters and numbers.</span>`; };
  if(save) save.onclick=()=>{ const k=inp.value.trim().replace(/\s+/g,""); if(!k){ toast("Paste the key first"); return; }
    if(!keyLooksRight(k)){ confirmBox("This doesn't look like a TickOff key (tko_ + 64 letters and numbers). Save it anyway?",()=>{ setKey(v.farm.name,k); card(); toast("Key saved on this phone"); }); return; }
    setKey(v.farm.name,k); card(); toast("Key saved on this phone");
    S.outbox.forEach(e=>{ if(farmKeyName(e.farm)===farmKeyName(v.farm.name) && e.status==="failed" && e.code===401){ e.status="waiting"; e.nextTry=0; } }); saveOutbox(); processOutbox(); };
  if(rm) rm.onclick=()=>confirmBox(`Remove the TickOff key for ${v.farm.name}?`,()=>{ setKey(v.farm.name,""); card(); });
}
function sendableActions(v){ return (v.actions||[]).filter(a=>(a.text||"").trim()); }
function tickoffFinishNote(v){
  const name=(v.farm.name||"").trim(); const n=sendableActions(v).length;
  if(!name||!getKey(name)) return `<p class="small muted" style="margin:0 0 8px">No TickOff key for this farm, so the actions won't go to TickOff. (Add it on the Farm step.)</p>`;
  return `<p class="small" style="margin:0 0 8px">✔️ ${n?`The ${n} action${n>1?"s":""} will also go to <b>${esc(name)}</b> in TickOff.`:"No actions to send to TickOff."}</p>`;
}
function tickoffPayloads(v){
  const acts=sendableActions(v).map(a=>{ const t=a.text.trim(); const o={text:t.length>300?t.slice(0,297)+"...":t, priority:a.priority||"Medium"};
    if(t.length>300) o.note=t; if(a.who) o.responsible=a.who; if(/^\d{4}-\d{2}-\d{2}$/.test(a.due||"")) o.due=a.due; return o; });
  const out=[]; const name=`Farm visit: ${v.farm.name||"Farm"}, ${dAU(v.visit.date)}`;
  for(let i=0;i<acts.length;i+=30){ const part=Math.floor(i/30)+1, parts=Math.ceil(acts.length/30);
    out.push({report_id:"visit-"+v.id+(parts>1?"-part"+part:""), report_name:name+(parts>1?` (part ${part} of ${parts})`:""), actions:acts.slice(i,i+30)}); }
  return out;
}
// Put the visit's actions in the Outbox. Returns true if something was queued.
function queueTickOff(v,manual){
  const name=(v.farm.name||"").trim();
  if(!name||!getKey(name)){ if(manual) toast("Add this farm's TickOff key on the Farm step first"); return false; }
  const ps=tickoffPayloads(v);
  if(!ps.length){ if(manual) toast("This visit has no actions to send"); return false; }
  let q=0;
  for(const p of ps){
    const old=S.outbox.find(e=>e.id===p.report_id);
    if(old && old.status==="sent"){ if(manual) toast("These actions were already added to TickOff"); continue; }
    if(old && old.status==="waiting"){ old.payload=p; old.count=p.actions.length; q++; continue; }
    S.outbox=S.outbox.filter(e=>e.id!==p.report_id);
    S.outbox.unshift({id:p.report_id,visitId:v.id,farm:name,date:v.visit.date,count:p.actions.length,created:Date.now(),status:"waiting",message:"Waiting to send",tries:0,nextTry:0,payload:p});
    q++;
  }
  saveOutbox(); return q>0;
}
let outboxBusy=false;
async function processOutbox(force){
  if(!S.standalone||outboxBusy) return; outboxBusy=true;
  let changed=false;
  try{
    for(const e of S.outbox){
      if(e.status!=="waiting") continue;
      if(!force && e.nextTry && Date.now()<e.nextTry) continue;
      if(navigator.onLine===false){ e.message="Waiting for signal – it will send when you're back in range."; changed=true; continue; }
      const key=getKey(e.farm);
      if(!key){ e.status="failed"; e.message=`No TickOff key for ${e.farm}. Add it on the farm's Farm step, then tap Try again.`; changed=true; continue; }
      e.tries=(e.tries||0)+1; e.lastTry=Date.now(); changed=true;
      let res, ans;
      try{
        res=await fetch(TICKOFF_URL,{method:"POST",headers:{"Content-Type":"application/json","X-TickOff-Key":key},body:JSON.stringify(e.payload)});
        ans=await res.json().catch(()=>({}));
      }catch(err){ e.message="Couldn't reach TickOff – it will try again when there's signal."; e.nextTry=Date.now()+2*60e3; continue; }
      const msg=(ans&&ans.message)||`TickOff answered with code ${res.status}.`;
      e.message=msg; e.code=res.status;
      if(res.ok && (ans.status==="added"||ans.status==="already"||ans.ok)){ e.status="sent"; e.sentAt=Date.now(); }
      else if(res.status===409){ e.nextTry=Date.now()+60*60e3; }                 // group full: try again in an hour
      else if(res.status===429){ e.nextTry=Date.now()+24*60*60e3; }            // too many today: try tomorrow
      else if(res.status>=500||res.status===0){ e.nextTry=Date.now()+10*60e3; } // TickOff problem: try again later
      else if(res.status===401){ e.status="failed"; e.message=msg+" Check this farm's TickOff key on the Farm step."; }
      else { e.status="failed"; }                                               // 400 / 413: fix needed, retry won't help
      toast("TickOff: "+msg);
    }
  } finally {
    outboxBusy=false;
    if(changed){ saveOutbox(); if(S.tab==="visits") renderVisits(); else if(S.tab==="report"&&cur()) renderReport(); }
  }
}
function outboxHtml(){
  if(!S.outbox.length) return "";
  const waiting=S.outbox.filter(e=>e.status==="waiting").length, failed=S.outbox.filter(e=>e.status==="failed").length;
  const badge=e=>e.status==="sent"?`<span class="badge sent">Sent</span>`:e.status==="failed"?`<span class="badge bad">Needs attention</span>`:`<span class="badge warn">Waiting</span>`;
  return `<div class="card"><h2>📤 TickOff outbox <span class="spacer"></span>${waiting?`<span class="badge warn">${waiting} waiting</span>`:""}${failed?`<span class="badge bad">${failed}</span>`:""}</h2>
    ${S.outbox.slice(0,15).map(e=>`<div class="visit-item" style="display:block">
      <div class="row"><b style="flex:1">${esc(e.farm)} – ${dAU(e.date)}</b>${badge(e)}</div>
      <div class="small muted">${e.count} action${e.count===1?"":"s"}${e.lastTry?` · last try ${new Date(e.lastTry).toLocaleString("en-AU",{day:"numeric",month:"short",hour:"numeric",minute:"2-digit"})}`:""}</div>
      <div class="small" style="margin-top:4px">${esc(e.message||"")}</div>
      ${e.status!=="sent"?`<div class="row" style="margin-top:6px"><button class="btn sec small" data-obsend="${esc(e.id)}">${e.status==="failed"?"Try again":"Send now"}</button><span class="spacer"></span><button class="btn danger small" data-obdel="${esc(e.id)}">Remove</button></div>`:""}
    </div>`).join("")}
    ${S.outbox.some(e=>e.status==="sent")?`<button class="btn ghost block small" id="obClear">Clear sent items</button>`:""}
  </div>`;
}
function tickoffReportHtml(v){
  const entries=S.outbox.filter(e=>e.visitId===v.id);
  const hasKey=!!getKey(v.farm.name);
  let line;
  if(entries.length){ const e=entries[0];
    line = e.status==="sent"?`✅ TickOff: ${esc(e.message)}`: e.status==="failed"?`⚠️ TickOff: ${esc(e.message)}`:`⏳ TickOff: ${esc(e.message)}`; }
  else line = hasKey?"Actions not sent to TickOff yet.":"No TickOff key for this farm.";
  return `<div class="small" style="margin-top:10px;padding:10px;border-radius:10px;background:var(--chip)">${line}
    ${hasKey&&(!entries.length||entries[0].status!=="sent")?`<button class="btn sec block" id="tkSend" style="margin-top:8px">Send actions to TickOff</button>`:""}</div>`;
}

function renderRef(){
  main.innerHTML=`<input class="searchbox" id="rq" placeholder="Search reference (e.g. chlorine, heat stress, coccidiosis)">
  ${REF.map((r,i)=>`<details class="card ref-sec" data-ref="${i}" ${r.open?"open":""}><summary>${r.t}</summary><div class="body">${r.h}</div></details>`).join("")}
  <p class="small muted" style="text-align:center">General guidance only. Follow the integrator's vet, your state's regulations and accreditation-scheme rules.</p>`;
  const q=document.getElementById('rq');
  q.oninput=()=>{ const s=q.value.trim().toLowerCase(); main.querySelectorAll('[data-ref]').forEach(d=>{ const hit=!s||d.textContent.toLowerCase().includes(s); d.classList.toggle('hide',!hit); if(s&&hit) d.open=true; }); };
  main.querySelectorAll('.ref-sec a[href^="http"]').forEach(a=>a.target="_blank");
}

async function boot(){
  S.standalone=!inClaude();
  if(S.standalone){
    setSync("Saved on this phone");
    if(await IDB.open()){
      for(const [k,v] of await IDB.all()){ if(String(k).startsWith("v:")&&v&&v.id) S.visits[v.id]=v; }
      S.outbox=(await IDB.get("outbox"))||[];
    } else { S.visits=lsGet(LS_KEY)||{}; S.outbox=lsGet("proten.outbox")||[]; }
    try{ if(navigator.storage&&navigator.storage.persist) navigator.storage.persist(); }catch(e){}
    if('serviceWorker' in navigator && /^https?:$/.test(location.protocol)){ navigator.serviceWorker.register('sw.js').catch(()=>{}); }
    window.addEventListener('online',()=>processOutbox(true));
    document.addEventListener('visibilitychange',()=>{ if(document.visibilityState==="hidden") flushNow(); else processOutbox(); });
    window.addEventListener('pagehide',()=>flushNow());
    setInterval(()=>processOutbox(),60000);
  } else {
    S.visits=lsGet(LS_KEY)||{};
  }
  S.currentId=lsGet(LS_CUR); if(S.currentId&&!S.visits[S.currentId]) S.currentId=null;
  render();
  if(S.standalone) processOutbox(); else initCaps();
}
